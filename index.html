<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fruit Ninja HTML</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at top, #1f2d42 0%, #0a1120 45%, #04070d 100%);
      font-family: Arial, sans-serif;
      color: white;
    }

    #game {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: none;
    }

    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    #score {
      color: #ffd166;
    }

    #misses {
      color: #ff6b6b;
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(5, 8, 16, 0.5);
      backdrop-filter: blur(3px);
    }

    .panel {
      background: rgba(10,20,30,0.7);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 18px;
      padding: 28px 34px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      text-align: center;
    }

    .panel h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3.2rem);
    }

    .panel p {
      margin: 8px 0 20px;
      opacity: 0.9;
    }

    button {
      border: none;
      background: linear-gradient(135deg, #ff8a00, #ff3d00);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      padding: 12px 22px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(255, 94, 0, 0.35);
    }

    #webcam {
      position: fixed;
      width: 180px;
      height: 120px;
      right: 20px;
      bottom: 20px;
      object-fit: cover;
      border-radius: 16px;
      transform: scaleX(-1);
      opacity: 0.9;
      border: 2px solid rgba(255,255,255,0.14);
      display: none;
      z-index: 15;
    }

    @media (max-width: 640px) {
      #hud { font-size: 20px; }
      #webcam { width: 140px; height: 94px; }
    }
  </style>
</head>
<body>
  <div id="hud">
    Score: <span id="score">0</span> &nbsp;|&nbsp;
    Misses: <span id="misses">0</span>/3
  </div>

  <canvas id="game"></canvas>
  <video id="webcam" autoplay playsinline muted></video>

  <div id="overlay">
    <div class="panel">
      <h1>Fruit Ninja</h1>
      <p>Slice fruits to gain points. Miss 3 and the game ends.</p>
      <button id="startBtn">Start Game</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const missesEl = document.getElementById("misses");
    const overlay = document.getElementById("overlay");
    const startBtn = document.getElementById("startBtn");
    const webcam = document.getElementById("webcam");

    const state = {
      score: 0,
      misses: 0,
      gameOver: false,
      running: false,
      fruits: [],
      particles: [],
      slices: [],
      pointer: { x: window.innerWidth / 2, y: window.innerHeight / 2 },
      trail: [],
      handPoint: null,
      lastTime: 0,
      spawnTimer: 0
    };

    const fruitPalette = [
      { name: "apple", color: "#ff4d4d", radius: 28 },
      { name: "orange", color: "#ff9f1c", radius: 26 },
      { name: "watermelon", color: "#2ecc71", radius: 32 },
      { name: "berry", color: "#e84393", radius: 22 },
      { name: "kiwi", color: "#7ae582", radius: 24 },
      { name: "banana", color: "#f7d154", radius: 20 }
    ];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function updateHud() {
      scoreEl.textContent = state.score;
      missesEl.textContent = `${state.misses}/3`;
    }

    function addTrailPoint(x, y) {
      state.trail.push({ x, y, time: performance.now() });
      if (state.trail.length > 18) state.trail.shift();
    }

    function getCursorPosition() {
      if (state.handPoint) return state.handPoint;
      return state.pointer;
    }

    function spawnFruit() {
      if (state.gameOver) return;

      const def = fruitPalette[Math.floor(Math.random() * fruitPalette.length)];
      const offset = 40;
      const x = rand(offset, canvas.width - offset);
      const y = canvas.height + 30;

      state.fruits.push({
        x,
        y,
        vx: rand(-4.5, 4.5),
        vy: rand(7, 11),
        radius: def.radius,
        color: def.color,
        name: def.name,
        rotation: rand(0, Math.PI * 2),
        rotationSpeed: rand(-0.16, 0.16),
        sliced: false,
        missed: false
      });
    }

    function createParticles(x, y, color) {
      for (let i = 0; i < 22; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = rand(1.5, 5.5);
        state.particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          radius: rand(2.6, 5.8),
          color,
          life: 42 + Math.random() * 18
        });
      }
    }

    function createSlicePieces(fruit) {
      const pieceCount = 2;
      for (let i = 0; i < pieceCount; i++) {
        const dir = i === 0 ? -1 : 1;
        state.slices.push({
          x: fruit.x,
          y: fruit.y,
          radius: fruit.radius * 0.9,
          color: fruit.color,
          rotation: fruit.rotation,
          rotSpeed: fruit.rotationSpeed * 2 + rand(-0.1, 0.1),
          vx: rand(2, 5) * dir,
          vy: rand(-3, 1),
          gravity: 0.14,
          half: i === 0 ? "left" : "right",
          life: 54
        });
      }
    }

    function sliceFruit(fruit) {
      if (fruit.sliced) return;
      fruit.sliced = true;
      state.score += 10;
      updateHud();

      createParticles(fruit.x, fruit.y, fruit.color);
      createSlicePieces(fruit);

      const idx = state.fruits.indexOf(fruit);
      if (idx >= 0) state.fruits.splice(idx, 1);
    }

    function endGame() {
      state.gameOver = true;
      state.running = false;
      overlay.style.display = "flex";
      overlay.innerHTML = `
        <div class="panel">
          <h1>Game Over</h1>
          <p>Final Score: <strong>${state.score}</strong></p>
          <p>You missed 3 fruits.</p>
          <button id="restartBtn">Play Again</button>
        </div>
      `;
      document.getElementById("restartBtn").addEventListener("click", restartGame);
    }

    function restartGame() {
      state.score = 0;
      state.misses = 0;
      state.gameOver = false;
      state.running = true;
      state.fruits = [];
      state.particles = [];
      state.slices = [];
      state.trail = [];
      state.lastTime = 0;
      state.spawnTimer = 0;
      overlay.style.display = "none";
      updateHud();
      requestAnimationFrame(gameLoop);
    }

    function updateFruits(dt) {
      for (let i = state.fruits.length - 1; i >= 0; i--) {
        const fruit = state.fruits[i];
        fruit.x += fruit.vx * dt;
        fruit.y += fruit.vy * dt;
        fruit.vy += 0.12 * dt;
        fruit.rotation += fruit.rotationSpeed * dt;

        if (fruit.y - fruit.radius > canvas.height) {
          state.misses += 1;
          state.score -= 1;
          updateHud();

          state.fruits.splice(i, 1);

          if (state.misses >= 3) {
            endGame();
            return;
          }
        }
      }
    }

    function updateParticles(dt) {
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 0.05 * dt;
        p.life -= dt;
        if (p.life <= 0) state.particles.splice(i, 1);
      }

      for (let i = state.slices.length - 1; i >= 0; i--) {
        const s = state.slices[i];
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.vy += s.gravity * dt;
        s.rotation += s.rotSpeed * dt;
        s.life -= dt;
        if (s.life <= 0) state.slices.splice(i, 1);
      }
    }

    function testCollision(fruit) {
      const cursor = getCursorPosition();
      const dx = fruit.x - cursor.x;
      const dy = fruit.y - cursor.y;
      const dist = Math.hypot(dx, dy);
      return dist < fruit.radius + 18;
    }

    function handleSlicing() {
      for (let i = state.fruits.length - 1; i >= 0; i--) {
        const fruit = state.fruits[i];
        if (!fruit.sliced && testCollision(fruit)) {
          sliceFruit(fruit);
        }
      }
    }

    function drawFruit(fruit) {
      ctx.save();
      ctx.translate(fruit.x, fruit.y);
      ctx.rotate(fruit.rotation);

      ctx.beginPath();
      ctx.arc(0, 0, fruit.radius, 0, Math.PI * 2);
      ctx.fillStyle = fruit.color;
      ctx.shadowColor = "rgba(255,255,255,0.2)";
      ctx.shadowBlur = 10;
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(-fruit.radius * 0.28, -fruit.radius * 0.28, fruit.radius * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, 0, fruit.radius * 0.2, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0,0,0,0.12)";
      ctx.fill();

      ctx.restore();
    }

    function drawFruitSlice(slice) {
      ctx.save();
      ctx.translate(slice.x, slice.y);
      ctx.rotate(slice.rotation);

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, slice.radius, slice.half === "left" ? Math.PI * 1.2 : -Math.PI * 0.2, slice.half === "left" ? Math.PI * 2.2 : Math.PI * 0.8);
      ctx.closePath();
      ctx.fillStyle = slice.color;
      ctx.fill();

      ctx.restore();
    }

    function drawParticles() {
      for (const p of state.particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life / 60);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawTrail() {
      if (state.trail.length < 2) return;

      ctx.beginPath();
      ctx.lineWidth = 10;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      for (let i = 0; i < state.trail.length; i++) {
        const p = state.trail[i];
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }

      const grad = ctx.createLinearGradient(
        state.trail[0].x, state.trail[0].y,
        state.trail[state.trail.length - 1].x, state.trail[state.trail.length - 1].y
      );
      grad.addColorStop(0, "rgba(255,255,255,0)");
      grad.addColorStop(0.18, "rgba(255,255,255,0.8)");
      grad.addColorStop(0.5, "rgba(88, 200, 255, 0.95)");
      grad.addColorStop(1, "rgba(255, 50, 100, 0.82)");
      ctx.strokeStyle = grad;
      ctx.stroke();

      ctx.beginPath();
      for (let i = 0; i < state.trail.length; i++) {
        const p = state.trail[i];
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.lineWidth = 4;
      ctx.strokeStyle = "rgba(255,255,255,0.85)";
      ctx.stroke();
    }

    function drawCursor() {
      const pointer = getCursorPosition();
      ctx.beginPath();
      ctx.fillStyle = "rgba(255,255,255,0.15)";
      ctx.arc(pointer.x, pointer.y, 18, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.fillStyle = "#ffffff";
      ctx.arc(pointer.x, pointer.y, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.strokeStyle = "rgba(255,255,255,0.8)";
      ctx.lineWidth = 2;
      ctx.arc(pointer.x, pointer.y, 14, 0, Math.PI * 2);
      ctx.stroke();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const fruit of state.fruits) drawFruit(fruit);
      for (const slice of state.slices) drawFruitSlice(slice);
      drawParticles();

      drawTrail();
      drawCursor();
    }

    function gameLoop(ts) {
      if (!state.running) return;

      const delta = Math.min(1.6, (ts - state.lastTime) / 16.67 || 1);
      state.lastTime = ts;

      state.spawnTimer -= delta;
      if (state.spawnTimer <= 0) {
        spawnFruit();
        state.spawnTimer = rand(34, 52);
      }

      updateFruits(delta);
      updateParticles(delta);
      handleSlicing();

      if (!state.gameOver) {
        draw();
        requestAnimationFrame(gameLoop);
      }
    }

    function updatePointerFromMouse(e) {
      state.pointer.x = e.clientX;
      state.pointer.y = e.clientY;
      addTrailPoint(e.clientX, e.clientY);
    }

    window.addEventListener("pointermove", updatePointerFromMouse);
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    startBtn.addEventListener("click", () => {
      state.running = true;
      state.gameOver = false;
      state.score = 0;
      state.misses = 0;
      state.fruits = [];
      state.particles = [];
      state.slices = [];
      state.trail = [];
      state.lastTime = 0;
      state.spawnTimer = 0;
      updateHud();
      overlay.style.display = "none";
      requestAnimationFrame(gameLoop);
    });

    function onHandResults(results) {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const tip = results.multiHandLandmarks[0][8];
        state.handPoint = {
          x: tip.x * canvas.width,
          y: tip.y * canvas.height
        };
        addTrailPoint(state.handPoint.x, state.handPoint.y);
      } else {
        state.handPoint = null;
      }
    }

    function setupCameraTracking() {
      const hasHands = typeof window.Hands !== "undefined" && typeof window.Camera !== "undefined";
      if (!hasHands) {
        return false;
      }

      webcam.style.display = "block";

      const hands = new window.Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
      });

      hands.onResults(onHandResults);

      const camera = new window.Camera(webcam, {
        onFrame: async () => {
          await hands.send({ image: webcam });
        },
        width: Math.min(window.innerWidth, 1280),
        height: Math.min(window.innerHeight, 720),
        facingMode: "user"
      });

      camera.start().catch(() => {
        webcam.style.display = "none";
      });

      return true;
    }

    setupCameraTracking();
    updateHud();
    draw();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</body>
</html>
